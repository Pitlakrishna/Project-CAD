# Production Docker Compose overrides (for single-node host or staging)
services:
  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  cad-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  llm-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  kong:
    restart: always
