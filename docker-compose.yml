services:
  # ----------------------------------------------------------------------------
  # Redis (Prompt & Model Cache for LLM Service)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aicad-redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secret}" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicad-network

  # ----------------------------------------------------------------------------
  # CAD Geometry Kernel Service (Node.js + OpenCASCADE / Replicad)
  # ----------------------------------------------------------------------------
  cad-service:
    build:
      context: ./services/cad-service
    container_name: aicad-cad-service
    restart: unless-stopped
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      NODE_ENV: production
      ENABLE_GRPC: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "8002:8080"
    networks:
      - aicad-network

  # ----------------------------------------------------------------------------
  # LLM CAD Generation Service (Python FastAPI)
  # ----------------------------------------------------------------------------
  llm-service:
    build:
      context: ./services/llm-service
    container_name: aicad-llm-service
    restart: unless-stopped
    environment:
      ENV: prod
      PORT: 8000
      HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      CACHE_ENABLED: "true"
      RABBITMQ_ENABLED: "false"
      CAD_SERVICE_URL: http://cad-service:8080
      AUTO_REPAIR_CAD_ERRORS: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
      cad-service:
        condition: service_started
    networks:
      - aicad-network

  # ----------------------------------------------------------------------------
  # Kong API Gateway (DB-less mode)
  # ----------------------------------------------------------------------------
  kong:
    image: kong:3.6
    container_name: aicad-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000" # Public Proxy Gateway
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      redis:
        condition: service_healthy
      llm-service:
        condition: service_started
      cad-service:
        condition: service_started
    networks:
      - aicad-network

networks:
  aicad-network:
    name: aicad-network
    driver: bridge

volumes:
  redis_data:
