version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL (Primary Relational Store for Auth, User, Payment)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aicad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicad_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aicad_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicad} -d ${POSTGRES_DB:-aicad_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicad-network

  # ----------------------------------------------------------------------------
  # Redis (Cache, Session Token Store & Pub/Sub)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aicad-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secret}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicad-network

  # ----------------------------------------------------------------------------
  # RabbitMQ (Async Event Bus & Messaging)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aicad-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicad-network

  # ----------------------------------------------------------------------------
  # MinIO (S3-Compatible Object Store for CAD Files & STEP/STL Exports)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: aicad-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aicad-network

  # ----------------------------------------------------------------------------
  # ClickHouse (Columnar Storage for Analytics & CAD Telemetry)
  # ----------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: aicad-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: aicad_analytics
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret}
    ports:
      - "8123:8123"   # HTTP interface
      - "9004:9000"   # Native TCP client (mapped to 9004 to avoid MinIO conflict)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aicad-network

  # ----------------------------------------------------------------------------
  # Kong API Gateway (DB-less mode for local development)
  # ----------------------------------------------------------------------------
  kong:
    image: kong:3.6-alpine
    container_name: aicad-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"   # Public Proxy Gateway
      - "8001:8001"   # Kong Admin API
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aicad-network

networks:
  aicad-network:
    name: aicad-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  clickhouse_data:
