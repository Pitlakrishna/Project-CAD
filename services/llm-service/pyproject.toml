[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicad-llm-service"
version = "0.1.0"
description = "AI Prompt Engine: Text-to-Replicad TypeScript 3D CAD generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "google-genai>=1.0.0",
    "redis>=5.0.0",
    "pika>=1.3.2",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
search-path = ["."]

[tool.pyright]
extraPaths = ["."]
reportMissingTypeStubs = false

[[tool.mypy.overrides]]
module = ["pika", "pika.*"]
ignore_missing_imports = true

