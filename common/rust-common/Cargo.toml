[package]
name = "rust-common"
version = "0.1.0"
edition = "2021"
description = "Shared Rust crate for AI CAD Platform (CAD engine & Ingestion)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
