[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicad-common"
version = "0.1.0"
description = "Shared Python utilities, auth middleware, and event schemas for AI CAD Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "pika>=1.3.2",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "prometheus-client>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aicad_common"]
