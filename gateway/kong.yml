_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false

  - name: user-service
    url: http://user-service:8082
    routes:
      - name: user-routes
        paths:
          - /api/v1/users
        strip_path: false

  - name: llm-service
    url: http://llm-service:8000
    routes:
      - name: llm-routes
        paths:
          - /api/v1/llm
        strip_path: false

  - name: cad-service
    url: http://cad-service:8080
    routes:
      - name: cad-routes
        paths:
          - /api/v1/cad
        strip_path: false

  - name: payment-service
    url: http://payment-service:8083
    routes:
      - name: payment-routes
        paths:
          - /api/v1/payments
        strip_path: false

  - name: file-service
    url: http://file-service:8084
    routes:
      - name: file-routes
        paths:
          - /api/v1/files
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Content-Type
        - Authorization
        - X-API-Key
        - X-Provider
        - X-Model
        - X-Base-URL
        - X-OpenAI-API-Key
        - X-Anthropic-API-Key
        - X-Gemini-API-Key
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600
